; PnP controller ESP32-C3-MINI-1. WiFi + ArduinoOTA.
;   pio run -e usb -t upload    first time / recovery: through the H7 (Controller/tools/flash_esp.py)
;   pio run -e ota -t upload    over WiFi
; WiFi in src/secrets.h (copy secrets.h.example)

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; 4MB, two 1.25MB app slots for OTA
board_build.partitions = default.csv

[env:usb]
upload_protocol = custom
extra_scripts = post:upload_h7.py

[env:ota]
upload_protocol = espota
upload_port = pnp-esp.local
